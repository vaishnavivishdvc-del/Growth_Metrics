name: GC Weekly Brief

on:
  schedule:
    - cron: "30 4 * * 1"   # 10:00 AM IST (UTC+5:30) every Monday
  workflow_dispatch:         # manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIXPANEL_USER:      ${{ secrets.MIXPANEL_USER }}
      MIXPANEL_SECRET:    ${{ secrets.MIXPANEL_SECRET }}
      GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_RECIPIENTS:   ${{ secrets.GMAIL_RECIPIENTS }}
      GCHAT_WEBHOOK:      ${{ secrets.GCHAT_WEBHOOK }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug environment
        run: |
          python --version
          pip show apscheduler numpy requests python-dotenv pytz
          python -c "
          import os
          keys = ['MIXPANEL_USER','MIXPANEL_SECRET','GMAIL_SENDER','GMAIL_APP_PASSWORD','GMAIL_RECIPIENTS','GCHAT_WEBHOOK']
          for k in keys:
              v = os.environ.get(k,'')
              print(f'{k}: {chr(34)}SET (len={len(v)}){chr(34) if v else chr(34)+\"MISSING\"+chr(34)}')
          "

      - name: Test Mixpanel API connectivity
        run: python debug_api.py

      - name: Run GC Brief
        run: python main.py --now
